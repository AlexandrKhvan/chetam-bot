[project]
name = "chetam-bot"
version = "0.1.0"
description = "CheTam («Чё там на завтра?») — personal Telegram todo, study schedule, and evening daily planner bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13.0,<4.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4,<4.0",
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.5.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.12",
    "tzdata>=2024.1",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
